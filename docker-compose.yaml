# PostgreSQL for EventFlow (from nestjs-microservices)
services:
  postgres:
    image: postgres:16-alpine
    container_name: eventflowapp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eventflowapp
      POSTGRES_PASSWORD: eventflow_password
      POSTGRES_DB: eventflowapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflowapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
